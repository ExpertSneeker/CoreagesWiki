name: Wiki PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: ['miso/wiki-pr-pipeline*']

permissions:
  contents: read

jobs:
  wiki-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: python3 -m unittest discover -s .github/wiki -p 'test_*.py'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check generated pages and paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/wiki/check_site.py
